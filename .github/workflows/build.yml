on:
  push:
    tags: "v*"
jobs:
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - run: dotnet tool install -g csharpier
      - run: csharpier check .
      - run: dotnet restore tests/Pneuma.Localization.Tests
      - run: dotnet build tests/Pneuma.Localization.Tests
      - run: dotnet run --project tests/Pneuma.Localization.Tests
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - run: dotnet restore src/Pneuma.Localization.Resx.Fixers
      - run: dotnet build src/Pneuma.Localization.Resx.Fixers --no-restore
      - run: dotnet pack --version "${GITHUB_REF_NAME#v}" -c Release -o publish --no-restore src/Pneuma.Localization.Resx.Fixers
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: |
          dotnet nuget push publish/Pneuma.Localization.Resx.${GITHUB_REF_NAME#v}.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
      - run: |
          gh release create "${GITHUB_REF_NAME}" \
            publish/Pneuma.Localization.Resx.${GITHUB_REF_NAME#v}.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
