'on':
  push:
    tags: v*
jobs:
  check:
    uses: ./.github/workflows/check-test.yml
  publish:
    needs: check
    name: Check, build, test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - run: dotnet tool install -g csharpier
      - run: csharpier check .
      - run: dotnet restore tests/Pneuma.Localization.UnitTests
      - run: dotnet build tests/Pneuma.Localization.UnitTests
      - run: dotnet run --project tests/Pneuma.Localization.UnitTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TestResults
          path: '**/TestResults/**'
      - run: dotnet pack --version "${GITHUB_REF_NAME#v}" -c Release -o publish --no-restore src/Pneuma.Localization.Resx.Fixers
      - uses: actions/upload-artifact@v7
        with:
          name: Pneuma.Localization.Resx.${GITHUB_REF_NAME#v}.nupkg
          path: publish/Pneuma.Localization.Resx.${GITHUB_REF_NAME#v}.nupkg
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: |
          dotnet nuget push publish/Pneuma.Localization.Resx.${GITHUB_REF_NAME#v}.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
      - run: |
          gh release create "${GITHUB_REF_NAME}" \
            publish/Pneuma.Localization.Resx.${GITHUB_REF_NAME#v}.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease

